name: Suggestion / Feature Request
description: Suggest an idea for Cosmiq
title: "[Suggestion]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## [Please read the guidelines before submitting](https://github.com/CosmiqGG/Cosmiq-GG/blob/main/CONTRIBUTING.md#suggestions-and-feature-requests)

        **One suggestion per issue.** If your idea has already been suggested, add a 👍 reaction to that issue instead of opening a new one.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Before you submit
      options:
        - label: I've read the guidelines and searched existing issues, and this hasn't been suggested yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Your suggestion
      description: What would you like to see in Cosmiq? Include as much detail as you can.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should it be added?
      description: What problem does it solve, or how would it improve Cosmiq?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra information
      description: Optional. Add mockups, screenshots, examples or anything else that helps explain your idea.
